name: roi-seg
channels:
  - defaults
dependencies:
  - python=3.10.18
  - pip=25.2
  - pip:
      # torch cuda 12.8, have to download from their website
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - timm==1.0.20

      # core: preprocessing, training, scoring, quantification
      - numpy==2.2.5
      - opencv-python==4.13.0.92
      - tifffile==2025.5.10
      - imagecodecs==2024.9.22       # tifffile's LZW decoder
      - pandas==2.3.2                # utils/util.py MetricTracker
      - tensorboard==2.20.0          # logger/visualization.py, optional

      # figures
      - matplotlib==3.10.6
      - scipy==1.15.3

      # whole-slide and CZI readers, preprocess.py only
      #- openslide-python==1.4.3   # I never actually got openslide working, so to truly reproduce what I did do not use it.
      - pylibczirw==6.0.1

      # SAM / microSAM baselines checkpoints are downloaded separately into saved/sam/.
      - git+https://github.com/facebookresearch/segment-anything.git
